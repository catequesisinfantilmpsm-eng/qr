<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#bd0015">
  <title>CATEKIDS | Asistencia a Misa</title>
  <style>
    :root{--azul:#0649b7;--dorado:#f6b900;--crema:#fffdfa;--verde:#16845b;--rojo:#c90018;--texto:#102d63}
    *{box-sizing:border-box} body{margin:0;background:#fff url('fondo-catekids.png') center top/cover fixed no-repeat;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--texto);min-height:100vh;padding:18px}
    body:before{content:"";position:fixed;inset:0;background:linear-gradient(#ffffff18,#ffffffb0 42%,#ffffff50);z-index:-1}
    .app{max-width:560px;margin:auto;padding-top:185px}.marca{text-align:center;margin:0 0 14px}.marca .sello{display:inline-block;background:linear-gradient(135deg,#d40018,#8d0010);color:white;border:3px solid var(--dorado);border-radius:999px;padding:8px 22px;box-shadow:0 6px 16px #74000a55}.marca h1{margin:0;color:white;letter-spacing:2px;font-size:1.7rem}.marca p{margin:3px 0 0;color:#fff;font-weight:650}
    .card{background:#fffffff2;border-radius:25px;padding:20px;box-shadow:0 16px 38px #77101f38;border:2px solid var(--dorado)}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
    button,input{font:inherit}.tab,.principal,.secundario{border:0;border-radius:14px;padding:13px;font-weight:750;cursor:pointer}.tab{background:#e7edf8;color:#42516c}.tab.activa,.principal{background:linear-gradient(135deg,#ffd84d,var(--dorado));color:#552d00}.secundario{background:linear-gradient(135deg,#0758d2,#00348b);color:white;width:100%;box-shadow:0 5px 0 #002866}
    label{font-weight:750;display:block;margin:9px 0 7px}.busqueda{display:flex;gap:8px}.busqueda input{width:100%;border:2px solid #ccd2dc;border-radius:14px;padding:14px;background:white;font-size:16px}.busqueda input:focus{outline:3px solid #f5c54266;border-color:#b79000}
    #resultados{display:grid;gap:8px;margin-top:12px}.persona{background:white;border:2px solid #dbe4f4;border-radius:14px;padding:12px;text-align:left;cursor:pointer}.persona strong,.persona small{display:block}.persona small{color:#5d6573;margin-top:3px}
    #lector{display:none}.video-box{background:#0a0a0a;border-radius:18px;overflow:hidden;aspect-ratio:1/1;position:relative;border:3px solid var(--azul)}video{width:100%;height:100%;object-fit:cover}.guia{position:absolute;inset:18%;border:4px solid var(--dorado);border-radius:18px;box-shadow:0 0 0 999px #0005}
    .seleccion{display:none;background:#fff;border:2px solid var(--dorado);border-radius:16px;padding:14px;margin:16px 0}.seleccion strong,.seleccion span{display:block}.gps{font-size:.88rem;color:#535d6e;margin:11px 0;text-align:center}
    .estado{display:none;margin-top:14px;border-radius:15px;padding:14px;text-align:center;font-weight:700}.estado.ok{display:block;background:#d8f5e7;color:#075c3c}.estado.error{display:block;background:#ffe0dc;color:#7f1d16}.cargando{opacity:.65;pointer-events:none}
    footer{text-align:center;color:#7c0010;font-weight:700;font-size:.78rem;margin:14px;text-shadow:0 1px #fff}.oculto{display:none!important}
    .bienvenida{position:fixed;inset:0;z-index:20;background:#ffffffed url('fondo-catekids.png') center/cover no-repeat;display:grid;place-items:center;padding:24px;transition:.35s}.bienvenida.cerrada{opacity:0;visibility:hidden}.bienvenida-box{max-width:440px;text-align:center;background:#fffffff2;border:3px solid var(--dorado);border-radius:28px;padding:28px 22px;box-shadow:0 20px 55px #69000e45}.bienvenida h2{color:var(--rojo);font-size:2rem;margin:0 0 8px}.bienvenida .cate{color:var(--azul);font-size:1.35rem;font-weight:900;letter-spacing:2px}.bienvenida p{font-size:1.05rem}.bienvenida button{background:linear-gradient(135deg,#d9001b,#960010);color:#fff;border:0;border-radius:16px;padding:14px 28px;font-weight:850;font-size:1.05rem;box-shadow:0 5px 0 #70000c}
    @media(max-width:600px){.app{padding-top:150px}.marca h1{font-size:1.45rem}.card{padding:15px}.tab{font-size:.9rem;padding:12px 7px}}
  </style>
</head>
<body>
<section class="bienvenida" id="bienvenida">
  <div class="bienvenida-box">
    <div class="cate">CATEKIDS</div>
    <h2>¡Bienvenidos!</h2>
    <p>Registremos con alegría nuestra asistencia a la Santa Misa.</p>
    <button id="entrar">Entrar y comenzar 🔔</button>
  </div>
</section>
<main class="app">
  <header class="marca"><div class="sello"><h1>CATEKIDS</h1><p>Asistencia a la Santa Misa</p></div></header>
  <section class="card" id="tarjeta">
    <div class="tabs">
      <button class="tab activa" id="tabQr">📷 Escanear QR</button>
      <button class="tab" id="tabNombre">🔎 Buscar nombre</button>
    </div>
    <section id="lector">
      <div class="video-box"><video id="video" playsinline muted></video><div class="guia"></div></div>
      <p class="gps">Coloca la tarjeta dentro del recuadro.</p>
    </section>
    <section id="manual" class="oculto">
      <label for="consulta">Nombre o apellidos</label>
      <div class="busqueda"><input id="consulta" autocomplete="new-password" placeholder="CATEKIDS"><button class="principal" id="buscar">Buscar</button></div>
      <div id="resultados"></div>
    </section>
    <div class="seleccion" id="seleccion"><strong id="nombreElegido"></strong><span id="datosElegidos"></span></div>
    <p class="gps" id="gps">📍 Solicitaremos permiso para guardar la ubicación.</p>
    <button class="secundario oculto" id="guardar">✅ Registrar asistencia</button>
    <div class="estado" id="estado"></div>
  </section>
  <footer>El GPS y la cámara solo funcionan con HTTPS y con permiso del dispositivo.</footer>
</main>
<script>
  const CONFIG={
    // Pegue entre comillas la URL que termina en /exec de su implementación de Apps Script.
    API_URL:'https://script.google.com/macros/s/AKfycbzr4gVmEENpE0uzsq_Nlfu8VbnCuI2XoJ5-A5Oa11xs2agDKS-QzXNQlbEnS-GAa4k/exec',
    API_KEY:''
  };
  const $=(s)=>document.querySelector(s);
  let elegida=null,ubicacion=null,stream=null,escaneando=false,audioCtx=null;
  function sonido(tipo){
    try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const ahora=audioCtx.currentTime;const notas=tipo==='qr'?[880,1175]:tipo==='guardar'?[520]:[660,880,1047];notas.forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=tipo==='guardar'?'sine':'triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,ahora+i*.11);g.gain.exponentialRampToValueAtTime(.18,ahora+i*.11+.015);g.gain.exponentialRampToValueAtTime(.0001,ahora+i*.11+.14);o.connect(g);g.connect(audioCtx.destination);o.start(ahora+i*.11);o.stop(ahora+i*.11+.15)})}catch(e){}
  }
  const estado=(texto,tipo='error')=>{const e=$('#estado');e.className='estado '+tipo;e.textContent=texto};
  function api(datos){
    if(!CONFIG.API_URL.startsWith('https://')) return Promise.reject(new Error('Primero configura la URL de Apps Script en index.html.'));
    return new Promise((resolve,reject)=>{
      const nombre='catekidsRespuesta_'+Date.now()+'_'+Math.floor(Math.random()*10000);
      const script=document.createElement('script');
      const reloj=setTimeout(()=>terminar(new Error('Apps Script no respondió. Revisa la implementación y el acceso público.')),15000);
      function terminar(error,valor){clearTimeout(reloj);delete window[nombre];script.remove();error?reject(error):resolve(valor)}
      window[nombre]=(j)=>{if(!j.ok&&datos.action!=='registrar')return terminar(new Error(j.error||'Error de conexión'));terminar(null,j)};
      const q=new URLSearchParams({...datos,key:CONFIG.API_KEY,callback:nombre,_:Date.now()});
      script.onerror=()=>terminar(new Error('No se pudo conectar con Apps Script.'));
      script.src=CONFIG.API_URL+'?'+q.toString();document.head.appendChild(script);
    });
  }
  async function obtenerGps(){
    if(!navigator.geolocation){$('#gps').textContent='⚠️ Este equipo no ofrece GPS.';return}
    $('#gps').textContent='📍 Obteniendo ubicación…';
    navigator.geolocation.getCurrentPosition(p=>{ubicacion={latitud:p.coords.latitude,longitud:p.coords.longitude,precision:Math.round(p.coords.accuracy)};$('#gps').textContent=`📍 Ubicación lista (precisión aproximada: ${ubicacion.precision} m)`},()=>{$('#gps').textContent='⚠️ Sin permiso de ubicación. El registro se guardará sin GPS.'},{enableHighAccuracy:true,timeout:12000,maximumAge:30000});
  }
  function elegir(p,metodo){
    elegida={...p,metodo};$('#nombreElegido').textContent=p.nombre;$('#datosElegidos').textContent=[p.curso,p.catequista].filter(Boolean).join(' · ');$('#seleccion').style.display='block';$('#guardar').classList.remove('oculto');$('#resultados').innerHTML='';detenerCamara();obtenerGps();
  }
  async function buscar(q,metodo='nombre'){
    try{estado('Buscando…','ok');const j=await api({action:'buscar',q});$('#estado').className='estado';
      if(!j.resultados.length)return estado('No encontramos coincidencias. Revisa el nombre o código.');
      if(metodo==='qr'&&j.resultados.length===1)return elegir(j.resultados[0],'QR');
      $('#resultados').innerHTML=j.resultados.map((p,i)=>`<button class="persona" data-i="${i}"><strong>${seguro(p.nombre)}</strong><small>${seguro([p.curso,p.catequista].filter(Boolean).join(' · '))}</small></button>`).join('');
      [...document.querySelectorAll('.persona')].forEach(b=>b.onclick=()=>elegir(j.resultados[+b.dataset.i],'Nombre'));
    }catch(e){estado(e.message)}
  }
  function seguro(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
  async function iniciarCamara(){
    $('#lector').style.display='block';
    if(!('BarcodeDetector'in window)){estado('Este navegador no tiene lector QR integrado. Usa “Buscar nombre” o abre la página en Chrome para Android.');return}
    try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});const v=$('#video');v.srcObject=stream;await v.play();escaneando=true;const detector=new BarcodeDetector({formats:['qr_code']});
      const ciclo=async()=>{if(!escaneando)return;try{const codigos=await detector.detect(v);if(codigos.length){escaneando=false;sonido('qr');navigator.vibrate?.([100,60,100]);buscar(codigos[0].rawValue,'qr');return}}catch(e){}requestAnimationFrame(ciclo)};ciclo();
    }catch(e){estado('No se pudo abrir la cámara. Revisa el permiso o usa la búsqueda por nombre.')}
  }
  function detenerCamara(){escaneando=false;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
  function mostrar(tipo){detenerCamara();elegida=null;$('#seleccion').style.display='none';$('#guardar').classList.add('oculto');$('#estado').className='estado';const qr=tipo==='qr';$('#tabQr').classList.toggle('activa',qr);$('#tabNombre').classList.toggle('activa',!qr);$('#manual').classList.toggle('oculto',qr);$('#lector').style.display=qr?'block':'none';if(qr)iniciarCamara()}
  $('#tabQr').onclick=()=>mostrar('qr');$('#tabNombre').onclick=()=>mostrar('nombre');$('#buscar').onclick=()=>buscar($('#consulta').value);$('#consulta').onkeydown=e=>{if(e.key==='Enter')buscar(e.target.value)};
  $('#guardar').onclick=async()=>{if(!elegida)return;sonido('guardar');const t=$('#tarjeta');t.classList.add('cargando');try{const j=await api({action:'registrar',codigo:elegida.codigo,metodo:elegida.metodo,...(ubicacion||{})});if(!j.ok)throw new Error(j.error);sonido('exito');navigator.vibrate?.([80,50,160]);estado(`✅ ${j.persona.nombre} — ${j.hora}`,'ok');elegida=null;$('#seleccion').style.display='none';$('#guardar').classList.add('oculto');setTimeout(()=>mostrar('qr'),2800)}catch(e){estado(e.message)}finally{t.classList.remove('cargando')}};
  $('#entrar').onclick=()=>{audioCtx=new(window.AudioContext||window.webkitAudioContext)();sonido('exito');$('#consulta').value='';$('#bienvenida').classList.add('cerrada');mostrar('qr')};
  window.addEventListener('pagehide',detenerCamara);$('#consulta').value='';
</script>
</body>
</html>
